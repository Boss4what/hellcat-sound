<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0507">
<title>Hellcat Sound</title>
<style>
html,body{height:100%;margin:0;background:#0b0507;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{background:radial-gradient(ellipse at 50% 35%,#2a0a0e 0%,#0b0507 70%);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 16px;box-sizing:border-box}
.top{width:min(94vw,460px);display:flex;align-items:center;justify-content:space-between}
.brand{font-size:20px;font-weight:800;letter-spacing:.14em}
.brand span{color:#e02020;margin-left:6px}
#btn{width:84px;height:84px;border-radius:50%;border:3px solid #555;background:#141012;color:#ddd;font-size:10px;font-weight:700;letter-spacing:.08em;line-height:1.3;cursor:pointer;padding:0}
#btn.on{border-color:#e02020;color:#ff5a5a;box-shadow:0 0 18px rgba(224,32,32,.5)}
#btn:disabled{opacity:.45}
#gauge{width:min(92vw,430px);height:auto;display:block}
#status{font-size:13px;color:#8a7c7e;min-height:1.2em}
.cells{width:min(94vw,460px);display:flex;justify-content:space-around;text-align:center}
.cell small{display:block;font-size:10px;letter-spacing:.12em;color:#9a8d8f}
.cell b{display:block;font-size:30px;font-variant-numeric:tabular-nums;margin-top:2px}
.ctl{display:flex;flex-direction:column;gap:5px;width:min(90vw,420px);font-size:13px;color:#aaa}
input[type=range]{width:100%;accent-color:#e02020}
label{display:flex;justify-content:space-between}
.demo{display:none}.demo.show{display:flex}
.btns{display:flex;gap:10px}
.btns button{background:none;border:1px solid #444;color:#999;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div class="top"><div class="brand">HELLCAT<span>SOUND</span></div><button id="btn" type="button" disabled>ENGINE<br>START<br>STOP</button></div>
<canvas id="gauge" width="760" height="640"></canvas>
<div id="status">Loading engine sound...</div>
<div class="cells"><div class="cell"><small>GEAR (SIM.)</small><b id="gear">N</b></div><div class="cell"><small>RPM (SIM.)</small><b id="rpm">0</b></div><div class="cell"><small>LOAD (SIM.)</small><b id="thr">0%</b></div></div>
<div class="ctl"><label>Volume <span id="volv">80%</span></label><input type="range" id="vol" min="0" max="100" value="80"></div>
<div class="ctl"><label>Whine <span id="whv">60%</span></label><input type="range" id="wh" min="0" max="100" value="60"></div>
<div class="ctl demo" id="demobox"><label>Demo speed <span id="demov">0</span></label><input type="range" id="demo" min="0" max="140" value="0"></div>
<div class="btns"><button id="mode" type="button">Demo mode</button><button id="units" type="button">MPH</button></div>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var rpmEl=$("rpm"),gearEl=$("gear"),thrEl=$("thr"),btn=$("btn"),st=$("status"),demo=$("demo"),cv=$("gauge"),g=cv.getContext("2d");

// hellcat-pack.wav = 12 Hellcat samples back to back (16 kHz mono). [start sample, length].
// on_ = on throttle at that RPM, off_ = off throttle (coasting) at that RPM. All are seamless loops except shift.
var PACK={idle:[0,68292],on_1300:[68292,19200],on_1600:[87492,15600],on_1900:[103092,14147],on_2350:[117239,40851],on_2850:[158090,37053],off_1300:[195143,16246],off_1600:[211389,30000],off_1900:[241389,32337],off_2350:[273726,40034],off_2750:[313760,37702],shift:[351462,6022]};
var ON=[1300,1600,1900,2350,2850],OFF=[1300,1600,1900,2350,2750],IDLE_RPM=750;
// Hellcat 8-speed auto: rpm per mph in each gear (gear ratio x 3.09 final drive / 20" tire)
var P={idle:750,redline:6200,gears:[148,99,66,53,41,32,27,21]};
var S={run:false,demo:false,kmh:false,mps:0,tgt:0,rpm:750,gear:1,thr:0,acc:0,prev:0,shiftUntil:0,vol:.8,wh:.6,watch:null,lat:null,lon:null,ft:0,wake:null};
var A={ctx:null,master:null,n:null,bufs:null,raw:null};

fetch("hellcat-pack.wav").then(function(r){if(!r.ok)throw new Error(r.status);return r.arrayBuffer()}).then(function(ab){A.raw=ab;btn.disabled=false;st.textContent="Ready. Tap ENGINE START."}).catch(function(e){st.textContent="Could not load engine sound ("+e.message+")"});

$("vol").oninput=function(){S.vol=this.value/100;$("volv").textContent=this.value+"%";if(A.master)A.master.gain.setTargetAtTime(S.vol,A.ctx.currentTime,.05)};
$("wh").oninput=function(){S.wh=this.value/100;$("whv").textContent=this.value+"%"};
demo.oninput=function(){$("demov").textContent=this.value};
$("units").onclick=function(){S.kmh=!S.kmh;this.textContent=S.kmh?"KM/H":"MPH"};
$("mode").onclick=function(){S.demo=!S.demo;$("demobox").classList.toggle("show",S.demo);this.textContent=S.demo?"GPS mode":"Demo mode";if(S.run){if(S.demo){stopGps();st.textContent="Demo mode"}else startGps()}};

function hav(a,b,c,d){var R=6371000,r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r,h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(h))}
function startGps(){
 if(!navigator.geolocation){st.textContent="No GPS in this browser";return}
 stopGps();st.textContent="Waiting for GPS...";
 S.watch=navigator.geolocation.watchPosition(function(p){
  var c=p.coords,t=p.timestamp,v=null;
  if(typeof c.speed==="number"&&c.speed>=0)v=c.speed;
  else if(S.lat!==null&&t>S.ft){var dt=(t-S.ft)/1000;if(dt>.3)v=hav(S.lat,S.lon,c.latitude,c.longitude)/dt}
  S.lat=c.latitude;S.lon=c.longitude;S.ft=t;
  if(v!==null){if(v<.6)v=0;S.tgt=v;st.textContent="GPS live (accuracy "+Math.round(c.accuracy||0)+" m)"}
 },function(e){st.textContent=e.code===1?"Location denied. Allow it in browser settings.":"GPS error: "+e.message},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
function stopGps(){if(S.watch!==null){navigator.geolocation.clearWatch(S.watch);S.watch=null}}
function clamp(x,a,b){return x<a?a:x>b?b:x}

// cut each sample out of the pack into its own buffer
function split(b){
 var d=b.getChannelData(0),out={},k,r=b.sampleRate/16000;   // decoder resamples to the device rate
 for(k in PACK){var s=Math.round(PACK[k][0]*r),n=Math.min(Math.round(PACK[k][1]*r),d.length-s),nb=A.ctx.createBuffer(1,n,b.sampleRate);nb.getChannelData(0).set(d.subarray(s,s+n));out[k]=nb}
 return out;
}
function loopSrc(buf,dest){var s=A.ctx.createBufferSource();s.buffer=buf;s.loop=true;var gn=A.ctx.createGain();gn.gain.value=0;s.connect(gn);gn.connect(dest);s.start(A.ctx.currentTime+Math.random()*.05);return {s:s,g:gn}}
function build(){
 var ctx=A.ctx,all=[],N={all:all,on:[],off:[]};
 var out=ctx.createGain();out.gain.value=0;out.connect(A.master);
 N.idle=loopSrc(A.bufs.idle,out);all.push(N.idle.s);
 ON.forEach(function(r){var v=loopSrc(A.bufs["on_"+r],out);N.on.push(v);all.push(v.s)});
 OFF.forEach(function(r){var v=loopSrc(A.bufs["off_"+r],out);N.off.push(v);all.push(v.s)});
 // supercharger whine on top
 var w=ctx.createOscillator(),wg=ctx.createGain();w.type="sawtooth";wg.gain.value=0;
 var wf=ctx.createBiquadFilter();wf.type="bandpass";wf.Q.value=7;w.connect(wf);wf.connect(wg);wg.connect(out);w.start();all.push(w);
 var w2=ctx.createOscillator(),w2g=ctx.createGain();w2.type="square";w2g.gain.value=0;var w2f=ctx.createBiquadFilter();w2f.type="bandpass";w2f.Q.value=9;w2.connect(w2f);w2f.connect(w2g);w2g.connect(out);w2.start();all.push(w2);
 N.out=out;N.w=w;N.wf=wf;N.wg=wg;N.w2=w2;N.w2f=w2f;N.w2g=w2g;
 A.n=N;
}
function teardown(){if(!A.n)return;A.n.all.forEach(function(n){try{n.stop()}catch(e){}try{n.disconnect()}catch(e){}});A.n=null}
function playShift(){
 if(!A.n)return;var s=A.ctx.createBufferSource();s.buffer=A.bufs.shift;var gn=A.ctx.createGain();gn.gain.value=.35+S.thr*.5;s.connect(gn);gn.connect(A.n.out);s.start();
}
// set gains + pitch for one bank (on or off): equal-power crossfade between the two samples nearest the current rpm
function bank(list,rpms,rpm,level,t){
 var i=0;while(i<rpms.length-2&&rpm>rpms[i+1])i++;
 var x=clamp((rpm-rpms[i])/(rpms[i+1]-rpms[i]),0,1);
 for(var k=0;k<list.length;k++){
  var gk=k===i?Math.cos(x*Math.PI/2):k===i+1?Math.sin(x*Math.PI/2):0;
  list[k].g.gain.setTargetAtTime(gk*level,t,.04);
  list[k].s.playbackRate.setTargetAtTime(clamp(rpm/rpms[k],.5,2.3),t,.04);
 }
}
function synth(){
 var N=A.n;if(!N)return;var t=A.ctx.currentTime,thr=S.thr,rpm=S.rpm;
 // idle below 800, fade into the 1300 samples by 1300 (they get pitched down to cover the gap)
 var id=clamp((rpm-800)/500,0,1),eng=Math.sin(id*Math.PI/2);
 N.idle.g.gain.setTargetAtTime(Math.cos(id*Math.PI/2),t,.05);
 N.idle.s.playbackRate.setTargetAtTime(clamp(rpm/IDLE_RPM,.9,1.6),t,.05);
 var on=clamp((thr-.04)/.3,0,1);                       // light cruise already counts as on-throttle
 bank(N.on,ON,rpm,eng*Math.sin(on*Math.PI/2),t);
 bank(N.off,OFF,rpm,eng*Math.cos(on*Math.PI/2),t);
 // supercharger whine: follows rpm, louder on throttle
 var load=clamp((rpm-P.idle)/(P.redline-P.idle),0,1);
 var whz=clamp(900+rpm*1.15,900,7200),wlev=S.wh*(.015+thr*.16+load*.08);
 N.w.frequency.setTargetAtTime(whz,t,.05);N.wf.frequency.setTargetAtTime(whz,t,.05);N.wg.gain.setTargetAtTime(wlev,t,.12);
 N.w2.frequency.setTargetAtTime(whz*1.5,t,.05);N.w2f.frequency.setTargetAtTime(whz*1.5,t,.05);N.w2g.gain.setTargetAtTime(wlev*.35,t,.12);
 N.out.gain.setTargetAtTime(1,t,.05);
}

// RPM / gear / throttle are simulated from GPS speed (nothing is read from the car)
function sim(dt){
 if(S.demo)S.tgt=parseFloat(demo.value)/2.237;
 S.mps+=(S.tgt-S.mps)*(1-Math.exp(-dt*2.2));
 var acc=(S.mps-S.prev)/Math.max(dt,.001);S.prev=S.mps;
 S.acc+=(acc-S.acc)*(1-Math.exp(-dt*3));
 var mph=S.mps*2.237,now=performance.now();
 var thr=mph<.5?0:S.acc<-.25?0:clamp(.08+mph/900+S.acc*.32,0,1);
 var rpmIn=function(n){return mph*P.gears[n-1]};
 var upAt=1500+thr*4000,downAt=1150+thr*900;
 if(now>S.shiftUntil){
  if(S.gear<8&&rpmIn(S.gear)>upAt&&rpmIn(S.gear+1)>1050&&S.acc>-.2){S.gear++;S.shiftUntil=now+220;if(S.run)playShift()}
  else if(S.gear>1&&rpmIn(S.gear)<downAt){S.gear--;S.shiftUntil=now+150}
 }
 if(mph<1)S.gear=1;
 var cut=now<S.shiftUntil;if(cut)thr*=.2;
 S.thr+=(thr-S.thr)*(1-Math.exp(-dt*(cut?25:6)));
 // torque converter: engine never drops under idle, and slips up a bit on launch
 var target=Math.max(rpmIn(S.gear),P.idle+(mph>.5&&mph<20?S.thr*900*(1-mph/20):0));
 if(mph<.5)target=P.idle;
 if(cut)target*=.9;
 target=clamp(target,P.idle*.95,P.redline+150);
 S.rpm+=(target-S.rpm)*(1-Math.exp(-dt*(cut?16:5)));
}

// Dial: RPM 0-8 (x1000) with needle, speed in the middle
function arc(cx,cy,r,a,b){g.beginPath();g.arc(cx,cy,r,a,b);g.stroke()}
function draw(){
 var cx=380,cy=300,R=290,a0=.75*Math.PI,sw=1.5*Math.PI,fr=clamp(S.rpm/8000,0,1);
 g.clearRect(0,0,760,640);
 g.lineCap="round";g.lineWidth=16;
 g.strokeStyle="#2b1114";arc(cx,cy,R,a0,a0+sw);
 g.strokeStyle="#6b1519";arc(cx,cy,R,a0+sw*6.2/8,a0+sw);
 g.strokeStyle="#e02020";arc(cx,cy,R,a0,a0+sw*fr);
 g.textAlign="center";g.textBaseline="middle";
 for(var i=0;i<=8;i++){
  var an=a0+sw*i/8,c=Math.cos(an),s=Math.sin(an);
  g.strokeStyle=i>=7?"#ff4a4a":"#b8aaac";g.lineWidth=5;g.beginPath();g.moveTo(cx+c*(R-34),cy+s*(R-34));g.lineTo(cx+c*(R-56),cy+s*(R-56));g.stroke();
  g.fillStyle=i>=7?"#ff4a4a":"#d8cdcf";g.font="600 34px system-ui,Arial,sans-serif";g.fillText(i,cx+c*(R-92),cy+s*(R-92));
  if(i<8){for(var k=1;k<4;k++){var am=a0+sw*(i+k/4)/8,cm=Math.cos(am),sm=Math.sin(am);g.strokeStyle="#6e6264";g.lineWidth=2.5;g.beginPath();g.moveTo(cx+cm*(R-34),cy+sm*(R-34));g.lineTo(cx+cm*(R-46),cy+sm*(R-46));g.stroke()}}
 }
 var na=a0+sw*fr;g.strokeStyle="#ff2a2a";g.lineWidth=8;g.beginPath();g.moveTo(cx-Math.cos(na)*24,cy-Math.sin(na)*24);g.lineTo(cx+Math.cos(na)*(R-70),cy+Math.sin(na)*(R-70));g.stroke();
 g.fillStyle="#150b0d";g.strokeStyle="#ff2a2a";g.lineWidth=5;g.beginPath();g.arc(cx,cy,20,0,7);g.fill();g.stroke();
 var sp=Math.round(S.mps*(S.kmh?3.6:2.237));
 g.fillStyle="#fff";g.font="800 150px system-ui,Arial,sans-serif";g.fillText(sp,cx,cy+170);
 g.fillStyle="#b8aaac";g.font="600 30px system-ui,Arial,sans-serif";g.fillText(S.kmh?"KM/H":"MPH",cx,cy+262);
 g.fillStyle="#6e6264";g.font="500 22px system-ui,Arial,sans-serif";g.fillText("GPS speed   x1000 RPM",cx,cy+300);
}

var last=performance.now(),frame=0;
function loop(){
 var now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
 sim(dt);if(S.run)synth();
 if((frame++&1)===0){
  rpmEl.textContent=Math.round(S.rpm).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
  gearEl.textContent=S.mps<.3?"N":S.gear;
  thrEl.textContent=Math.round(S.thr*100)+"%";
  draw();
 }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function start(){
 if(!A.raw){st.textContent="Sound not loaded yet";return}
 if(!A.ctx){var AC=window.AudioContext||window.webkitAudioContext;A.ctx=new AC({latencyHint:"interactive"});A.master=A.ctx.createGain();A.master.gain.value=0;var comp=A.ctx.createDynamicsCompressor();comp.threshold.value=-8;comp.ratio.value=3;A.master.connect(comp);comp.connect(A.ctx.destination)}
 var go=function(){build();A.master.gain.setTargetAtTime(S.vol,A.ctx.currentTime,.3);S.run=true;btn.className="on";
  if(S.demo)st.textContent="Demo mode";else startGps();
  if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){S.wake=w}).catch(function(){})};
 var ready=function(){if(A.bufs)go();else A.ctx.decodeAudioData(A.raw.slice(0),function(b){A.bufs=split(b);go()},function(){st.textContent="Could not decode engine sound"})};
 if(A.ctx.state==="suspended")A.ctx.resume().then(ready);else ready();
}
function stop(){
 S.run=false;btn.className="";
 if(A.master)A.master.gain.setTargetAtTime(0,A.ctx.currentTime,.15);
 setTimeout(teardown,500);stopGps();st.textContent="Stopped";S.tgt=0;
 if(S.wake){try{S.wake.release()}catch(e){}S.wake=null}
}
btn.onclick=function(){S.run?stop():start()};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.run&&navigator.wakeLock&&!S.wake)navigator.wakeLock.request("screen").then(function(w){S.wake=w}).catch(function(){})});
})();
</script>
</body>
</html>
