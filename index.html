<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Hellcat Sound</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;box-sizing:border-box;text-align:center}
#speed{font-size:min(38vw,200px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#unit{font-size:18px;letter-spacing:.2em;color:#888}
.row{display:flex;gap:28px;font-size:22px;color:#aaa;font-variant-numeric:tabular-nums}
.row b{color:#fff;display:block;font-size:30px}
.row small{font-size:11px;letter-spacing:.15em}
#bar{width:min(90vw,420px);height:10px;background:#222;border-radius:5px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:#e02020}
#btn{width:150px;height:150px;border-radius:50%;border:5px solid #333;background:#111;color:#fff;font-size:22px;font-weight:700;letter-spacing:.1em;cursor:pointer}
#btn.on{border-color:#e02020;color:#e02020}
#status{font-size:14px;color:#888;min-height:1.2em}
.ctl{display:flex;flex-direction:column;gap:6px;width:min(90vw,420px);font-size:13px;color:#aaa}
input[type=range]{width:100%;accent-color:#e02020}
label{display:flex;justify-content:space-between}
.demo{display:none}.demo.show{display:flex}
#mode{background:none;border:1px solid #333;color:#888;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
</style>
</head>
<body>
<div id="speed">0</div>
<div id="unit">MPH</div>
<div class="row"><div><small>RPM</small><b id="rpm">0</b></div><div><small>GEAR</small><b id="gear">N</b></div><div><small>LOAD</small><b id="thr">0%</b></div></div>
<div id="bar"><i id="rpmbar"></i></div>
<button id="btn" type="button">START</button>
<div id="status">GPS idle</div>
<div class="ctl"><label>Volume <span id="volv">70%</span></label><input type="range" id="vol" min="0" max="100" value="70"></div>
<div class="ctl"><label>Aggression <span id="aggv">60%</span></label><input type="range" id="agg" min="0" max="100" value="60"></div>
<div class="ctl demo" id="demobox"><label>Demo speed <span id="demov">0</span></label><input type="range" id="demo" min="0" max="140" value="0"></div>
<button id="mode" type="button">Switch to demo mode</button>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var speedEl=$("speed"),rpmEl=$("rpm"),gearEl=$("gear"),thrEl=$("thr"),bar=$("rpmbar"),btn=$("btn"),st=$("status"),demo=$("demo");
// Hellcat-style supercharged 6.2L V8: 8 cylinders, ~700 rpm idle, 6200 redline, heavy blower whine
var P={cyl:8,idle:720,redline:6200,gears:[196,133,96,73,57,45]};
var S={run:false,demo:false,mps:0,tgt:0,rpm:720,gear:1,thr:0,acc:0,prev:0,shiftUntil:0,vol:.7,agg:.6,watch:null,lat:null,lon:null,ft:0,wake:null};
var A={ctx:null,master:null,n:null};

$("vol").oninput=function(){S.vol=this.value/100;$("volv").textContent=this.value+"%";if(A.master)A.master.gain.setTargetAtTime(S.vol,A.ctx.currentTime,.05)};
$("agg").oninput=function(){S.agg=this.value/100;$("aggv").textContent=this.value+"%"};
demo.oninput=function(){$("demov").textContent=this.value};
$("mode").onclick=function(){S.demo=!S.demo;$("demobox").classList.toggle("show",S.demo);this.textContent=S.demo?"Switch to GPS mode":"Switch to demo mode";if(S.run){if(S.demo){stopGps();st.textContent="Demo mode"}else startGps()}};

function hav(a,b,c,d){var R=6371000,r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r,h=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(h))}
function startGps(){
 if(!navigator.geolocation){st.textContent="No GPS in this browser";return}
 stopGps();st.textContent="Waiting for GPS...";
 S.watch=navigator.geolocation.watchPosition(function(p){
  var c=p.coords,t=p.timestamp,v=null;
  if(typeof c.speed==="number"&&c.speed>=0)v=c.speed;
  else if(S.lat!==null&&t>S.ft){var dt=(t-S.ft)/1000;if(dt>.3)v=hav(S.lat,S.lon,c.latitude,c.longitude)/dt}
  S.lat=c.latitude;S.lon=c.longitude;S.ft=t;
  if(v!==null){if(v<.6)v=0;S.tgt=v;st.textContent="GPS live (accuracy "+Math.round(c.accuracy||0)+" m)"}
 },function(e){st.textContent=e.code===1?"Location denied. Allow it in browser settings.":"GPS error: "+e.message},{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
function stopGps(){if(S.watch!==null){navigator.geolocation.clearWatch(S.watch);S.watch=null}}

var distCache={};
function dist(a){var k=Math.round(a*20)/20;if(distCache[k])return distCache[k];var n=1024,c=new Float32Array(n),kk=k*60+1;for(var i=0;i<n;i++){var x=i*2/n-1;c[i]=(1+kk)*x/(1+kk*Math.abs(x))}return distCache[k]=c}
function build(){
 var ctx=A.ctx,all=[],N={all:all};
 var out=ctx.createGain();out.gain.value=0;out.connect(A.master);
 var ws=ctx.createWaveShaper();ws.curve=dist(.6);ws.oversample="2x";
 var lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=600;lp.Q.value=.9;
 var pk=ctx.createBiquadFilter();pk.type="peaking";pk.frequency.value=160;pk.gain.value=9;pk.Q.value=1.2;
 ws.connect(lp);lp.connect(pk);pk.connect(out);
 var mix=ctx.createGain();mix.gain.value=.35;mix.connect(ws);
 N.osc=[["sawtooth",1,.9],["square",.5,.6],["sawtooth",2,.3],["sawtooth",3,.15],["sawtooth",1.5,.12]].map(function(s){var o=ctx.createOscillator(),g=ctx.createGain();o.type=s[0];g.gain.value=s[2];o.connect(g);g.connect(mix);o.start();all.push(o);return{o:o,m:s[1]}});
 var lope=ctx.createOscillator(),lg=ctx.createGain();lg.gain.value=0;lope.connect(lg);lg.connect(mix.gain);lope.start();all.push(lope);
 var len=ctx.sampleRate*2,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
 var ns=ctx.createBufferSource();ns.buffer=buf;ns.loop=true;var nb=ctx.createBiquadFilter();nb.type="bandpass";nb.frequency.value=900;nb.Q.value=.8;var ng=ctx.createGain();ng.gain.value=0;ns.connect(nb);nb.connect(ng);ng.connect(ws);ns.start();all.push(ns);
 // supercharger whine: two tones, pitch tracks rpm, level tracks load
 var w=ctx.createOscillator(),wg=ctx.createGain();w.type="sine";wg.gain.value=0;w.connect(wg);wg.connect(out);w.start();all.push(w);
 var w2=ctx.createOscillator(),w2g=ctx.createGain();w2.type="triangle";w2g.gain.value=0;w2.connect(w2g);w2g.connect(out);w2.start();all.push(w2);
 N.out=out;N.ws=ws;N.lp=lp;N.lope=lope;N.lg=lg;N.nb=nb;N.ng=ng;N.w=w;N.wg=wg;N.w2=w2;N.w2g=w2g;N.lastThr=0;
 A.n=N;
}
function teardown(){if(!A.n)return;A.n.all.forEach(function(n){try{n.stop()}catch(e){}try{n.disconnect()}catch(e){}});A.n=null}
function synth(dt){
 var N=A.n;if(!N)return;var t=A.ctx.currentTime,ty=.04,thr=S.thr,ag=S.agg;
 var fire=S.rpm/60*(P.cyl/2);
 N.osc.forEach(function(s){s.o.frequency.setTargetAtTime(fire*s.m,t,ty)});
 N.lp.frequency.setTargetAtTime(Math.min(9000,350+thr*(1800+2200*ag)+S.rpm*.12),t,ty);
 N.ws.curve=dist(.25+ag*.6+thr*.3);
 var idleF=Math.max(0,1-(S.rpm-P.idle)/1500);
 N.lope.frequency.setTargetAtTime(fire/4,t,ty);N.lg.gain.setTargetAtTime(.3*idleF*.5,t,ty);
 N.nb.frequency.setTargetAtTime(600+fire*4,t,ty);
 var decel=thr<.05&&S.rpm>2500;
 N.ng.gain.setTargetAtTime(thr*.35*(.4+ag)+(decel?.14:0),t,ty);
 if(decel&&Math.random()<dt*10){N.ng.gain.setValueAtTime(.6,t);N.ng.gain.setTargetAtTime(.1,t+.01,.03)}
 var boost=Math.min(1,thr*1.3)*Math.min(1,S.rpm/3500),wf=500+S.rpm*.9;
 N.w.frequency.setTargetAtTime(wf,t,.25);N.w2.frequency.setTargetAtTime(wf*2.02,t,.25);
 N.wg.gain.setTargetAtTime(boost*.07,t,.2);N.w2g.gain.setTargetAtTime(boost*.025,t,.2);
 N.out.gain.setTargetAtTime(.28+Math.min(1,(S.rpm-P.idle)/(P.redline-P.idle))*.45+thr*.25,t,ty);
 N.lastThr=thr;
}

function sim(dt){
 if(S.demo)S.tgt=parseFloat(demo.value)/2.237;
 S.mps+=(S.tgt-S.mps)*(1-Math.exp(-dt*2.2));
 var acc=(S.mps-S.prev)/Math.max(dt,.001);S.prev=S.mps;
 S.acc+=(acc-S.acc)*(1-Math.exp(-dt*3));
 var mph=S.mps*2.237,now=performance.now();
 var thr=.08+Math.min(.25,mph/400)+S.acc*.45;if(S.acc<-.3)thr=0;thr=Math.max(0,Math.min(1,thr));
 var rpmIn=function(g){return P.idle+mph*P.gears[g-1]};
 var upAt=P.redline-400-(1-thr)*2000,downAt=P.idle+900;
 if(now>S.shiftUntil){
  if(S.gear<6&&rpmIn(S.gear)>upAt&&S.acc>-.2){S.gear++;S.shiftUntil=now+160}
  else if(S.gear>1&&rpmIn(S.gear)<downAt){S.gear--;S.shiftUntil=now+120}
 }
 var cut=now<S.shiftUntil;if(cut)thr*=.15;
 S.thr+=(thr-S.thr)*(1-Math.exp(-dt*(cut?25:7)));
 var target=mph<.5?P.idle+Math.sin(now/180)*25:rpmIn(S.gear);
 if(cut)target*=.86;
 target=Math.max(P.idle*.95,Math.min(P.redline+150,target));
 S.rpm+=(target-S.rpm)*(1-Math.exp(-dt*(cut?18:5)));
}

var last=performance.now(),frame=0;
function loop(){
 var now=performance.now(),dt=Math.min(.1,(now-last)/1000);last=now;
 sim(dt);if(S.run)synth(dt);
 if((frame++&1)===0){ // update text every other frame to keep it light
  speedEl.textContent=Math.round(S.mps*2.237);
  rpmEl.textContent=Math.round(S.rpm/10)*10;
  gearEl.textContent=S.mps<.3?"N":S.gear;
  thrEl.textContent=Math.round(S.thr*100)+"%";
  bar.style.width=(Math.min(1,S.rpm/(P.redline+300))*100)+"%";
 }
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

function start(){
 if(!A.ctx){var AC=window.AudioContext||window.webkitAudioContext;A.ctx=new AC({latencyHint:"interactive"});A.master=A.ctx.createGain();A.master.gain.value=0;var comp=A.ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;A.master.connect(comp);comp.connect(A.ctx.destination)}
 var go=function(){build();A.master.gain.setTargetAtTime(S.vol,A.ctx.currentTime,.3);S.run=true;btn.className="on";btn.textContent="STOP";
  if(S.demo)st.textContent="Demo mode";else startGps();
  if(navigator.wakeLock)navigator.wakeLock.request("screen").then(function(w){S.wake=w}).catch(function(){})};
 if(A.ctx.state==="suspended")A.ctx.resume().then(go);else go();
}
function stop(){
 S.run=false;btn.className="";btn.textContent="START";
 if(A.master)A.master.gain.setTargetAtTime(0,A.ctx.currentTime,.15);
 setTimeout(teardown,500);stopGps();st.textContent="GPS idle";S.tgt=0;
 if(S.wake){try{S.wake.release()}catch(e){}S.wake=null}
}
btn.onclick=function(){S.run?stop():start()};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&S.run&&navigator.wakeLock&&!S.wake)navigator.wakeLock.request("screen").then(function(w){S.wake=w}).catch(function(){})});
})();
</script>
</body>
</html>
